[package]
name = "comparator-opt"
version = "0.1.1"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Accept a fast, hard-to-read function only if it matches a short readable reference. A reference implementation using differential tests, a SHA-256 lock, and Lean 4 proofs."
repository = "https://github.com/san-digital/comparator-opt"
homepage = "https://github.com/san-digital/comparator-opt"
documentation = "https://docs.rs/comparator-opt"
readme = "README.md"
keywords = ["verification", "differential-testing", "swar", "lean", "optimization"]
categories = ["development-tools::testing", "command-line-utilities", "algorithms", "mathematics"]

[[bin]]
name = "comparator-opt"
path = "src/bin/comparator_opt.rs"

[dependencies]

[workspace]
